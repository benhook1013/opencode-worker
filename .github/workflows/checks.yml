name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix runtime
      - run: python3 -m compileall -q worker.py live_worker.py native_transport.py cli_router.py install.py tests
      - run: bash -n bin/api-worker
      - run: python3 -m unittest discover -s tests -v
